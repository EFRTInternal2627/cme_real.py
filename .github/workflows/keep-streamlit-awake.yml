name: Keep Streamlit Awake

on:
  schedule:
    # Runs every 4 hours, at 17 minutes past the hour
    - cron: "17 */4 * * *"

  # This lets us test it manually from GitHub
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit Streamlit app
        env:
          APP_URL: "https://cmerealpy-ap5xczhdyvpramjfopbfsy.streamlit.app/"
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]

          print(f"Opening {url}")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              # Give Streamlit time to fully load
              page.wait_for_timeout(15000)

              # If Streamlit happened to fall asleep,
              # try clicking the wake-up button.
              wake_button = page.get_by_text(
                  "Yes, get this app back up!",
                  exact=False
              )

              if wake_button.count() > 0:
                  print("App was asleep. Waking it up...")
                  wake_button.first.click()

                  # Give Streamlit time to restart
                  page.wait_for_timeout(30000)

                  page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(10000)

              print("Streamlit visit completed!")
              print("Page title:", page.title())

              browser.close()
          PY
